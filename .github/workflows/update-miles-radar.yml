name: Atualizar radar de milhas

on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar fontes oficiais
        run: node scripts/update-miles-radar.mjs
      - name: Salvar alterações encontradas
        run: |
          if git diff --quiet; then
            echo "Nenhuma mudança no radar."
            exit 0
          fi
          git config user.name "tripnordestinos-radar"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/miles-radar.json
          git commit -m "chore: atualiza radar diário de milhas"
          git push
